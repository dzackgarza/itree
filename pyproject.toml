[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "itree"
version = "0.1.0"
description = "Deterministic traversal layer over GitHub sub-issue trees"
requires-python = ">=3.14"
license = {text = "MIT"}
authors = [{name = "Agent", email = "agent@localhost"}]
dependencies = [
    "cyclopts>=2.0",
    "pydantic>=2.0",
    "networkx>=3.0",
    "markdown-it-py[linkify]>=4.2.0",
    "specify-cli==1.4.4.dev0",
]

[dependency-groups]
test = [
    "pytest>=9.0",
    "pytest-xdist>=3.8.0",
]
typing = ["types-networkx>=3.6.0"]

[project.scripts]
itree = "itree.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/itree"]

[tool.uv.sources]
specify-cli = { git = "https://github.com/github/spec-kit", rev = "a4d571229e164e440f8950cac034607bae7b7518" }

[tool.pytest.ini_options]
markers = [
    "serial: run after all read-only cases and under the mutation lock",
    "fresh: include the fresh live-comment mutation in parallel timing samples",
]
